<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16101f"/>
      <stop offset="1" stop-color="#0c0c13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="72%">
      <stop offset="0" stop-color="#B026FF" stop-opacity="0.45"/>
      <stop offset="62%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="p" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.1" flood-color="#B026FF" flood-opacity="0.95"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#B026FF" stroke-opacity="0.5" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glow)"/>
  <!-- ghost glitch vermelho -->
  <text x="31" y="44" text-anchor="middle" font-family="'Chakra Petch','Trebuchet MS',Verdana,sans-serif"
        font-weight="700" font-size="34" fill="#FF2A4D" fill-opacity="0.55">X9</text>
  <!-- marca principal -->
  <text x="32" y="43" text-anchor="middle" font-family="'Chakra Petch','Trebuchet MS',Verdana,sans-serif"
        font-weight="700" font-size="34" fill="#F3F1FA" filter="url(#p)">X9</text>
</svg>
