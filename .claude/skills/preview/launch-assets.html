<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<title>X9 — Launch Assets</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:radial-gradient(120% 80% at 50% 0%,#160f22,#07070b 60%);color:var(--text-hi);font-family:var(--font-body);padding:34px;box-sizing:border-box}
  h2{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-low);margin:34px 0 14px}
  h2:first-child{margin-top:0}
  .grid{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end}
  .tile{display:flex;flex-direction:column;align-items:center;gap:8px}
  .lab{font-family:var(--font-mono);font-size:11px;color:var(--text-low)}
  .chk{background:
      linear-gradient(45deg,#1a1a24 25%,transparent 25%),
      linear-gradient(-45deg,#1a1a24 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1a1a24 75%),
      linear-gradient(-45deg,transparent 75%,#1a1a24 75%);
    background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0;background-color:#0e0e15;
    border-radius:8px;display:flex;align-items:center;justify-content:center}
  img{display:block;image-rendering:auto}
  .banner{border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;max-width:620px;box-shadow:var(--shadow-card)}
  .banner img{width:100%}
  .split{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
  .splash{height:300px;border:1px solid var(--line-soft);border-radius:18px}
</style></head><body>

<h2>Favicon — abas (tamanho real)</h2>
<div class="grid">
  <div class="tile"><span class="chk" style="width:16px;height:16px"><img src="../public/favicon-16.png" width="16" height="16"/></span><span class="lab">16 png</span></div>
  <div class="tile"><span class="chk" style="width:32px;height:32px"><img src="../public/favicon-32.png" width="32" height="32"/></span><span class="lab">32 png</span></div>
  <div class="tile"><span class="chk" style="width:48px;height:48px"><img src="../public/favicon.svg" width="48" height="48"/></span><span class="lab">svg @48</span></div>
  <div class="tile"><span class="chk" style="width:16px;height:16px"><img src="../public/favicon.svg" width="16" height="16"/></span><span class="lab">svg @16</span></div>
  <div class="tile"><span class="chk" style="width:32px;height:32px"><img src="../public/icon-mono.svg" width="32" height="32"/></span><span class="lab">mono</span></div>
</div>

<h2>App icons</h2>
<div class="grid">
  <div class="tile"><img src="../public/apple-touch-icon.png" width="96" height="96" style="border-radius:20px"/><span class="lab">apple-touch 180</span></div>
  <div class="tile"><img src="../public/icon-192.png" width="96" height="96" style="border-radius:20px"/><span class="lab">icon 192</span></div>
  <div class="tile"><img src="../public/icon-512.png" width="120" height="120" style="border-radius:26px"/><span class="lab">icon 512</span></div>
  <div class="tile">
    <div style="position:relative;width:120px;height:120px">
      <img src="../public/icon-512-maskable.png" width="120" height="120" style="border-radius:50%"/>
      <div style="position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(176,38,255,.5)"></div>
    </div>
    <span class="lab">maskable (safe zone)</span>
  </div>
</div>

<h2>Open Graph 1200×630 &nbsp;·&nbsp; Splash standalone</h2>
<div class="split">
  <div class="banner"><img src="../public/og-image.png"/></div>
  <div class="tile"><img class="splash" src="../public/launch-portrait.png"/><span class="lab">launch-portrait 1290×2796</span></div>
</div>

</body></html>
