<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0}body{background:radial-gradient(120% 90% at 50% 0%,#16101f,#0b0b11 60%);font-family:var(--font-body);padding:26px;box-sizing:border-box;color:var(--text-hi)}
.row{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{background:var(--neon-purple);border-radius:4px;box-shadow:var(--glow-purple-sm)}
.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-low)}</style></head><body>
<div class="row">
  <div class="unit"><div class="box" style="width:4px;height:4px"></div><div class="lab">4</div></div>
  <div class="unit"><div class="box" style="width:8px;height:8px"></div><div class="lab">8</div></div>
  <div class="unit"><div class="box" style="width:12px;height:12px"></div><div class="lab">12</div></div>
  <div class="unit"><div class="box" style="width:16px;height:16px"></div><div class="lab">16</div></div>
  <div class="unit"><div class="box" style="width:24px;height:24px"></div><div class="lab">24</div></div>
  <div class="unit"><div class="box" style="width:32px;height:32px"></div><div class="lab">32</div></div>
  <div class="unit"><div class="box" style="width:48px;height:48px"></div><div class="lab">48</div></div>
  <div class="unit"><div class="box" style="width:64px;height:64px"></div><div class="lab">64</div></div>
</div>
</body></html>
