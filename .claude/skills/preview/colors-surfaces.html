<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  html,body{margin:0}
  body{background:radial-gradient(120% 90% at 50% 0%,#16101f,#0b0b11 60%);color:var(--text-hi);font-family:var(--font-body);padding:22px;box-sizing:border-box}
  *{box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;border-radius:var(--r-md);height:104px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line-soft)}
  .nm{font-family:var(--font-display);font-size:12px;font-weight:600}
  .hx{font-family:var(--font-mono);font-size:11px;color:var(--text-low)}
  .dot{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-soft)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#07070B"><div class="dot" style="background:#07070B"></div><div><div class="nm">bg-void</div><div class="hx">#07070B</div></div></div>
  <div class="sw" style="background:#0C0C13"><div class="dot" style="background:#0C0C13"></div><div><div class="nm">bg-base</div><div class="hx">#0C0C13</div></div></div>
  <div class="sw" style="background:#14141F"><div class="dot" style="background:#14141F"></div><div><div class="nm">bg-surface</div><div class="hx">#14141F</div></div></div>
  <div class="sw" style="background:#1C1C2A"><div class="dot" style="background:#1C1C2A"></div><div><div class="nm">bg-elevated</div><div class="hx">#1C1C2A</div></div></div>
  <div class="sw" style="background:#14141F"><div style="display:flex;gap:6px"><span class="dot" style="background:#F3F1FA"></span><span class="dot" style="background:#A9A4BD"></span><span class="dot" style="background:#6B6880"></span></div><div><div class="nm">text hi / mid / low</div><div class="hx">#F3F1FA · #A9A4BD · #6B6880</div></div></div>
</div>
</body></html>
