<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0}body{background:radial-gradient(120% 90% at 50% 0%,#16101f,#0b0b11 60%);font-family:var(--font-body);padding:24px;box-sizing:border-box}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:var(--r-md);font-family:var(--font-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px;padding:15px 24px;cursor:pointer}
.primary{background:linear-gradient(180deg,#C95CFF,#B026FF 55%,#8E12E0);color:var(--text-on-neon);box-shadow:var(--glow-purple),inset 0 1px 0 rgba(255,255,255,.35)}
.danger{background:linear-gradient(180deg,#FF4D68,#FF2A4D 55%,#C1121F);color:#fff;box-shadow:var(--glow-red),inset 0 1px 0 rgba(255,255,255,.25)}
.ghost{background:rgba(176,38,255,.06);color:var(--neon-purple-soft);border-color:var(--line-neon);box-shadow:inset 0 0 18px -8px rgba(176,38,255,.6)}
.disabled{background:#241b33;color:var(--text-low);border-color:var(--line-soft);box-shadow:none}</style></head><body>
<div class="row">
  <button class="btn primary">Nova Partida</button>
  <button class="btn danger">Confirmar Eliminação</button>
  <button class="btn ghost">Como Jogar</button>
  <button class="btn disabled">Iniciar Jogo</button>
</div>
</body></html>
