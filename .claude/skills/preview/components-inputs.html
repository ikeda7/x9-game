<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>html,body{margin:0}body{background:radial-gradient(120% 90% at 50% 0%,#16101f,#0b0b11 60%);font-family:var(--font-body);padding:22px;box-sizing:border-box}
.col{display:flex;flex-direction:column;gap:12px;max-width:340px}
.field{display:flex;gap:10px}
.inp{flex:1;padding:14px 16px;border-radius:var(--r-md);background:var(--bg-elevated);border:1px solid var(--line-neon);color:var(--text-hi);font-family:var(--font-body);font-size:16px}
.add{width:52px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-md);border:1px solid var(--line-neon);background:rgba(176,38,255,.12);color:var(--neon-purple-soft);box-shadow:var(--glow-purple-sm)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:var(--r-pill);border:1px solid var(--line-neon);background:rgba(176,38,255,.08);color:var(--neon-green);align-self:flex-start}
.pill .x9-label{color:var(--neon-green);letter-spacing:.08em}
.icn{display:inline-flex;color:var(--neon-green)}</style></head><body>
<div class="col">
  <div class="pill"><span class="icn" style="color:var(--neon-green)"><i data-lucide="check-circle-2" width="15"></i></span><span class="x9-label">4 jogadores prontos</span></div>
  <div class="field">
    <input class="inp" value="Bia" />
    <span class="add"><i data-lucide="plus" width="22"></i></span>
  </div>
</div>
<script>lucide.createIcons()</script>
</body></html>
