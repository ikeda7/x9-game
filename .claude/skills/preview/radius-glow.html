<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>html,body{margin:0}body{background:radial-gradient(120% 90% at 50% 0%,#16101f,#0b0b11 60%);font-family:var(--font-body);padding:28px;box-sizing:border-box;color:var(--text-hi)}
.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.tile{width:120px;height:96px;background:var(--bg-surface);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}
.lab{font-family:var(--font-mono);font-size:11px;color:var(--text-low)}</style></head><body>
<div class="row">
  <div class="tile" style="border-radius:var(--r-sm)"><span class="x9-label" style="color:var(--text-mid)">sm 10</span></div>
  <div class="tile" style="border-radius:var(--r-md);box-shadow:var(--glow-purple-sm)"><span class="x9-label" style="color:var(--neon-purple-soft)">md 14 · glow</span></div>
  <div class="tile" style="border-radius:var(--r-xl);border-color:var(--neon-red);box-shadow:var(--glow-red)"><span class="x9-label" style="color:#FF8095">xl 28 · danger</span></div>
  <div class="tile" style="border-radius:var(--r-xl);border-color:var(--neon-green);box-shadow:var(--glow-green)"><span class="x9-label" style="color:#9CFFC8">xl 28 · win</span></div>
</div>
</body></html>
