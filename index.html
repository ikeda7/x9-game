<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Título & descrição -->
    <title>X9 — Jogo do Impostor</title>
    <meta
      name="description"
      content="O party game do impostor para jogar com amigos em um único celular. Descubra quem é o X9."
    />

    <!-- Cor da UI do navegador / standalone -->
    <meta name="theme-color" content="#0C0C13" />
    <meta name="color-scheme" content="dark" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="mask-icon" href="/icon-mono.svg" color="#B026FF" />

    <!-- Add-to-home-screen (iOS + Android) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="X9" />
    <link rel="apple-touch-startup-image" href="/launch-portrait.png" />

    <!-- PWA manifest (somente add-to-home; sem service worker) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph / compartilhamento -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="X9 — Jogo do Impostor" />
    <meta property="og:title" content="X9 — Jogo do Impostor" />
    <meta
      property="og:description"
      content="O party game do impostor para jogar com amigos em um único celular. Descubra quem é o X9."
    />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://x9-game.vercel.app/" />
    <meta
      property="og:image"
      content="https://x9-game.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="X9 — Jogo do Impostor" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="X9 — Jogo do Impostor" />
    <meta
      name="twitter:description"
      content="O party game do impostor para jogar com amigos em um único celular."
    />
    <meta
      name="twitter:image"
      content="https://x9-game.vercel.app/og-image.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
